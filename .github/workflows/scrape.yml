name: Scrape GOV.UK apprenticeships

# Goal: check several times a day, every day, all year.
#
# This used to fire six times and use a gate step to keep only the fires that
# landed on 09:00 / 13:00 / 16:00 UK time, so the checks sat on exact local
# hours all year round. That was wrong in practice. GitHub does not start
# scheduled jobs on time - on free runners they queue, often for hours - so by
# the time a job actually ran the UK clock had moved past its slot and the gate
# threw it away. The run still reported success, because skipping was the
# intended behaviour, just for the wrong reason.
#
# Measured over September 2026: every automatic data commit landed in the 13:xx
# hour. Not one at 09:00, not one at 16:00, with two six-day blackouts. The
# tracker was checking about once a day, not three times.
#
# So the gate is gone. Every fire now runs. The cost is that the checks drift by
# an hour between GMT and BST, which does not matter to anyone - and in exchange
# they actually happen.
on:
  schedule:
    - cron: "0 8,12,16,20 * * *"
  workflow_dispatch:       # manual "run now" button in the GitHub Actions tab (always runs)
    inputs:
      test_notification:
        description: "Send a single notification and exit (does not scrape)"
        type: boolean
        default: false
      alert_text:
        description: "Custom alert text to send instead of the dummy test message"
        type: string
        required: false
        default: ""

permissions:
  contents: write          # allow the job to commit the updated data files

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run GOV.UK scraper (PowerShell)
        shell: pwsh
        run: ./scrape.ps1
        env:
          # Telegram notifications: add these as repo SECRETS (Settings → Secrets and variables → Actions → Secrets).
          # The bot token is sensitive — it must be a Secret, never committed to the repo.
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
          ALERT_TEXT: ${{ inputs.alert_text }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional alternative — ntfy.sh topic as a repo Variable (not secret).
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}

      - name: Commit updated data if changed
        run: |
          git config user.name  "apprenticeship-bot"
          git config user.email "actions@github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "Auto-update apprenticeship data ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
